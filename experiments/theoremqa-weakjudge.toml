# TheoremQA, 91 cases. Python650 was tried first and abandoned: code correctness
# is *independently verifiable by the judge* — it can simply read the program —
# so the seeded flawed explanation fooled it 0 times in 4, and there were no
# error cases to contest. Debate is only interesting where the judge cannot
# check the answer itself, so the domain has to be one it cannot just solve.
#
# Whether maths clears that bar is the open question this spec exists to answer.
#
# Judge weakened to the challenger's tier. The debaters represent the powerful
# AIs; the judge and the challenger both stand in for humans, so they belong at
# the same rung. With judge = debater model the error rate was 0/4 on code and
# 1/18 on maths — a strong judge verifies for itself and needs no transcript,
# which removes both the error cases and the reason debate exists.
name = "theoremqa-weakjudge"
cases = "data/cases/ftf-theoremqa.jsonl"
arms = ["debate"]
conditions = ["matched"]
repeats = 1
profile = "paper"

[debate]
# Settled by A/B against v4-flash and v4-pro-0813: same reliability as a model
# with ~4x the active compute, at 1/17th the cost per decided debate.
debater_model = "deepseek/deepseek-v4-flash-0731"
judge_model = "qwen/qwen3-8b"
n_rounds = 3
# 400, not uncapped: uncapped killed ~60% of runs through runaway Thinking
# sections. May still be too small — first knob to revisit.
word_limit = 400
max_tokens = 8192
# ~25% of decisions die to a repetition loop, and the failures fall on the
# debater defending the flawed answer, so they cannot simply be dropped.
max_decision_attempts = 2
judge_cot = true
seed = 0

[client]
max_concurrency = 8
max_runs_in_flight = 4
