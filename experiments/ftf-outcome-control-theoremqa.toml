# Outcome-controlled construction, theoremqa (91 cases).
#
# 91 cases, every one carrying a real flaw explanation, so this subset is the
# only one of the two that can support the valid-objection metric.
#
# All three arms over one case file: the same cases decided three ways, which is
# what makes a cross-arm detection rate a comparison of the arms rather than of
# three different flaws. Under outcome_control the decisive content of each
# arm's record is the dataset's own text:
#
#   single         the whole output, and no API call at all
#   self_critique  the revision; the draft is that text with one error injected
#                  at a different step, and the critique has to find that one
#   debate         round 1, verbatim, as the two opening arguments
#
# Caveat worth knowing before reading any number off this: seed and sound_seed
# are 0.76 (gpqa) to 0.89 (theoremqa) character-similar at the median, so a
# verbatim round 1 shows the judge two near-identical worked solutions differing
# in about one step. That is a real detection task; it does not read like a
# debate.
name = "ftf-oc-theoremqa"
cases = "data/cases/ftf-theoremqa.jsonl"
arms = ["single", "self_critique", "debate"]
conditions = ["matched"]
repeats = 1
profile = "paper"

[debate]
outcome_control = true
# Judge-only recourse: the challenger writes a challenge and a recourse judge
# rules on it, with no exchange in between. The alternative -- a round of debate
# about the challenge -- would assign advocates to a solo decision that had
# none, and the contest stage has to be the constant across arms. Its own
# question (does a recourse debate *amplify* a weak challenge?) is a planned
# extension, recorded in deferred.md.
recourse_rounds = 0
debater_model = "deepseek/deepseek-v4-flash-0731"
judge_model = "deepseek/deepseek-v4-flash-0731"
n_rounds = 3
word_limit = 400
max_tokens = 8192
max_decision_attempts = 2
judge_cot = true
seed = 0

[client]
max_concurrency = 8
max_runs_in_flight = 4
