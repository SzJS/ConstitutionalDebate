# Pilot: a few items from every surviving subset, all three conditions, end to end.
#
# Purpose is harness verification, not measurement. It also yields the per-condition
# error rates that size the main run, and the failure modes a synthetic test cannot
# show — truncation, repetition loops, malformed-after-repair.
name = "pilot"
cases = "data/cases/pilot.jsonl"
conditions = ["single", "self_critique", "debate"]
repeats = 1

[debate]
# Settled by the probe, 2026-08-25 (outputs/pick-weak/DECISION.md). The judge and the
# challenger are the weak model; the debaters stay strong, as the protocol requires.
# Leaving judge_model equal to debater_model would make the pilot measure a strong-judge
# debate, which is not the experiment.
debater_model    = "deepseek/deepseek-v4-flash-0731"
judge_model      = "openai/gpt-4.1-nano"
challenger_model = "openai/gpt-4.1-nano"
# recourse_judge_model defaults to judge_model, comprehension_model to challenger_model.
# Both are deliberately left unset: the design says the debate recourse judge is the
# weak judge, and the comprehension probe is asked inside the challenger's own
# conversation.

[client]
max_concurrency = 8
max_runs_in_flight = 4
