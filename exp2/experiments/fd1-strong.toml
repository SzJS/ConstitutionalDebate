# fd1, ARM F-STRONG of 2 — THE SAME FINDINGS PROTOCOL WITH A STRONG JUDGE, on all 1,644
# stored debate transcripts.
#
# READ FIRST: `records/experiments/findings-1/PREREG.md`, to be committed before this
# arm's first paid call, and `experiments/fd1-weak.toml`, which this spec is only readable
# beside. The population, the endpoints, the comparator, the named outcomes, the validity
# clauses, the missing-cell rule and the stop rules are in PREREG and none of them is
# restated here. `outputs/fd1-run-all.sh` refuses to start until PREREG is TRACKED BY GIT.
#
# WHAT THIS ARM IS FOR. F-weak asks whether decomposing the judgment lets a weak
# stakeholder contest a weak judge without breaking right decisions. The obvious rival
# reading of anything it finds — in either direction — is that the FORMAT is fine and the
# JUDGE was the binding constraint, or that the format only works when the judge is weak
# enough to be caught out. So the same protocol is run end to end with a strong model in
# both judge seats and nothing else changed: same debates, same challenger, same grader,
# same caps, same prompts, same derivation rule.
#
# WHAT DIFFERS FROM `fd1-weak.toml` IS TWO LINES AND ONE PIN, and that is the whole diff:
# `judge_model` and `recourse_judge_model` are `openai/gpt-5.6-luna-20260709` instead of
# Maverick, and the `[debate.provider_order]` entry pins that slug to `openai`. Everything
# else in this file is byte-identical to F-weak's.
#
# WHY THE DATED ID AND THE BASE SLUG. `LLM_NOTES.md` §1 records that
# `openai/gpt-5.6-luna-20260709` is the served id; every spec before this one sent the
# bare `openai/gpt-5.6-luna` and was served by OpenAI anyway. The provider check of
# 2026-09-02 (`records/derivations/fd1-provider-check.py`,
# `outputs/fd1-provider-check.log`) sent both, plus the dated id pinned, and all three
# returned `SERVED BY: OpenAI`, `finish_reason stop` and 0 reasoning tokens. The dated id
# is used because it is the one that cannot silently become a different model, and the pin
# is the BASE slug `openai` — NOT `openai/fast` and NOT `openai/flex`, which are price and
# latency tiers rather than the default route. PREREG §8 records the id, the pin and that
# log.
#
# REASONING IS OFF, at the default, and the check confirmed it costs no reasoning tokens.
# A findings judge that reasons at length would be a different judge from the one F-weak
# runs and the two arms would not be a format comparison.
#
# THE SAME-MODEL PROPERTY HOLDS HERE TOO: the model that writes the findings rules on the
# contest against its own findings. Disclosed, as in every arm of this project since jd3.
#
# P1 IS A SEPARATE FAMILY. PREREG's registered claim for F-weak is the conjunction P1 ∧ P2
# at α 0.05; this arm's P1 is its own family at its own α 0.05 and the two are NEVER
# pooled. P2 is F-weak's alone — jd5-B's break rate is a Maverick number and there is no
# strong-judge comparator to test against. This arm's rates are reported beside F-weak's
# as DESCRIPTIVE, and a split between the arms is reported as a split.
#
# THE DEBATES ARE NOT RE-RUN, and nothing under `outputs/experiments/jd3-main` is written;
# it is fingerprinted before, between and after the arms by `outputs/fd1-run-all.sh` and
# must equal `dfa9bdca3fe93630701b4659cdb4ac8605ce07d58b29c29ad868c1048c12209c`.
#
# THE POPULATION IS WHAT jd3-main DECIDED — 1,644 of 2,110 cells; the rest are skipped
# with `no source decision to re-judge`. A findings list that truncates or will not parse
# buys ONE format repair and then fails its cell, counted and left undecided.
#
# LAUNCH IT THROUGH THE DRIVER, not by hand. It runs F-weak first, then this arm:
#
#     cd exp2
#     nohup outputs/fd1-run-all.sh > outputs/fd1-run-all.log 2>&1 &
#     echo $! > outputs/fd1-run-all.pid
#
# WHAT THIS SPEC ACTUALLY SPENDS, and it is not the `--dry-run` total. That figure is a
# per-stage BOUND for every stage that could ever be run against this tree; the driver
# runs six and the calls they make are:
#
#     1,644  findings judgments   (1 per stored decision, luna, `rejudge`)
#     1,644  challenger objections + 1,644 comprehension probes   (flash, `contest`)
#    <=1,644 recourse-judge rulings   (1 per cell that contests, luna, `contest`)
#         0  agreement calls      (MECHANICAL under this arm — see below)
#    <=1,644 ruling_agreement reads    (1 per ruling, Haiku; off the decision path)
#    <=1,644 findings grades      (1 per contested objection, Haiku; off the path)
#     ----
#     `analyse` makes none. luna is the dearer of the two judges per output token, so this
#     arm's judge and ruling terms cost more than F-weak's at the same call count.
#
# MEASURED AT THE SMOKE: TBD. The per-cell figure from `outputs/fd1-smoke-cost.txt` and
# the pilot's, times 1.3, is what PREREG §8 registers; this line is filled in before the
# first full-run call and not before.
#
# `agreement` MAKES NO CALL UNDER THIS ARM. The line-vs-prose instrument is MECHANICAL
# here: the objection's argument is a numbered list this harness has already parsed, so
# `phantom_contest` is `(stance == contests) != (well-formed contests > 0)` — a string
# comparison (`recourse.mechanical_agreement`), `parse_mode = "mechanical"`, no Haiku, no
# spend. The stage still runs and still writes a real `Agreement` for every contested and
# every declined cell, so `agrees` and `phantom_contest` work unchanged downstream; the
# rate is NEVER pooled with the Haiku-read column of jd3-jd6. `--dry-run` prints that term
# as 0 and says why.
#
# RESUME AND RETRY, per stage, because they differ:
#
#   * `rejudge` follows `decide`'s rule and READS `--retry-failed`, which the driver
#     passes: a cell already re-judged here is skipped, and so is one whose latest run
#     FAILED — unless the flag, in which case it is re-attempted once. A cell that fails
#     twice is counted and left undecided, never silently skipped.
#   * `contest` resumes on the ARTIFACT: its only skip is "some run under this cell's
#     contest directory holds a `challenge.json`". A cell whose challenger call failed
#     wrote none and is re-attempted on every resume, with or without the flag; a cell
#     that wrote a challenge and then lost its RULING is skipped as already contested and
#     stays ruling-less, which PREREG's missing-cell rule drops from P1.
#   * `agreement`, `ruling_agreement` and `grade` each resume on their own artifact
#     (`already measured` / `already graded`) and are re-attempted until they land.
#   * `analyse` reads the tree and writes the index; it spends nothing and is idempotent.

name = "fd1-strong"

# THE WHOLE DEBATE GRID. 2,110 cells, of which `jd3-main` decided 1,644; the rejudge stage
# skips the rest with `no source decision to re-judge`. The driver reports the decided
# count against 1,644 and halts if the arm wrote no findings at all.
cases = "data/cases/ftf-all.jsonl"

# THE TRANSCRIPTS, NOT THE DECISIONS. This tree makes its own decisions — findings lists
# over the same stored debates F-weak reads. Read-only; fingerprinted by the driver.
transcripts_from = "outputs/experiments/jd3-main"

# ONE CONDITION, and it is the whole point twice over. Only a debate publishes a judgment
# that is a document other than the decision itself, so a decomposed judgment is defined
# here and undefined in the other two; and only a debate leaves a record a second judge
# can be handed without re-running the decision, which is what `rejudge` needs.
conditions = ["debate"]
repeats = 1

# THE STAGES THIS SPEC'S DRIVER RUNS, stated so `--dry-run` can echo it. Every term in the
# estimate is a per-stage bound printed whether or not that stage is in the run, so the
# total is a bound over ALL stages and not this driver's bill.
planned_stages = ["rejudge", "contest", "agreement", "ruling_agreement", "grade", "analyse"]

[debate]
# Byte-identical to `fd1-weak.toml`'s block except for the two judge lines and the pin. It
# has to be: this arm exists to move the judge and nothing else.
debater_model    = "deepseek/deepseek-v4-flash-0731"

# THE STRONG FINDINGS JUDGE. The DATED id, which is the one the provider check sent and
# the one that cannot silently become a different model; pinned to `openai` below.
judge_model      = "openai/gpt-5.6-luna-20260709"

# Unchanged from F-weak and from jd3-jd6, and UNPINNED as it has been in every run: Google
# is its only provider, so there is nothing to pin it against. Holding the challenger
# fixed across the arms is what makes the judge the only thing that moved.
challenger_model = "google/gemini-2.5-flash"

# THE FIRST OF THE TWO LINES THAT MAKE THIS THE FINDINGS CAMPAIGN. The judge writes one
# numbered finding per purported flaw and NO verdict line; the verdict is derived by code.
# `Sides.verdict_order` is unused under this form — there is no verdict template to order
# — and `--dry-run` says so in the WHY column.
judge_form = "findings"

# THE SECOND. The challenger contests a finding, an omission or a contradiction, with
# quotes existence-checked at parse time, and its claimed verdict is DERIVED from the
# contests rather than asserted. It selects the challenger's system prompt, its objection
# format, the mechanical `agreement`, the findings grader, and (through the objection's
# arm) the findings ruling prompt and its reader. `DebateConfig` refuses this value with
# any `judge_form` but "findings", and `experiment_cli` refuses an `fd1`-named spec that
# states neither.
challenger_variant = "findings"

# Every condition's objection is ruled by a third party rather than by the decider
# re-deciding in its own conversation. Note what it does NOT mean here: the third party is
# the same MODEL as the findings judge, by design (see the same-model note above).
recourse_form = "third_party"

# ONE JUDGE THROUGHOUT, and the same dated id. Stated rather than left to inherit
# `judge_model`, even though the value is identical, because the design is that these two
# are deliberately the same and a reader of `config.json` must see it said.
recourse_judge_model = "openai/gpt-5.6-luna-20260709"

# Unchanged from `sweep.toml`, jd3-main and F-weak. The cap for the roles that emit a
# decision line — the findings judge, the challenger, the recourse judge, the
# comprehension probe. A findings list is longer than a prose verdict, so this cap is
# doing more work here than it has in any earlier run; a truncation is fatal to the cell
# and is counted.
max_tokens = 16384

# Unchanged. The cap for the roles that produce record text. Nothing here generates record
# text, but it is what the copied debate was argued under.
generation_max_tokens = 8192

# Unchanged. The challenger is the role under measurement: at 0 every stakeholder writes
# the same objection, and variance across objections is part of the result.
challenger_temperature = 0.7

# --- provider routing ----------------------------------------------------------------
[debate.provider_order]
# The debaters', copied unedited. It binds the strong model, which this run does not call
# at all — the debates are read from disk.
"deepseek/deepseek-v4-flash-0731" = ["gmicloud/fp8", "coreweave/fp8"]
# THE JUDGE AND THE RECOURSE JUDGE, PINNED — they are the same slug and therefore one
# entry. `openai` is the BASE slug from the endpoint list: `openai/flex` and `openai/fast`
# are cheaper and dearer tiers of the same provider and neither is the default route, so
# pinning to one of those would be changing the service as well as fixing it. One real
# pinned call on 2026-09-02 returned `SERVED BY: OpenAI`, `finish_reason stop`, 0
# reasoning tokens (`outputs/fd1-provider-check.log`).
"openai/gpt-5.6-luna-20260709" = ["openai"]
# provider_allow_fallbacks stays at its default False. A pin that silently falls back is
# not a pin.

[client]
# 16/8, as the sweep proved and every judgment-debate run re-confirmed. Every stage here
# is one to three short calls per cell where `decide` was up to seven strong-model ones.
max_concurrency = 16
max_runs_in_flight = 8

# Each contest directory carries a full copy of the decision it contests — here a findings
# decision, which carries `findings.json`, the copied transcript and the debate's own wire
# log. That is what makes a contest record self-contained, and it is why this tree costs
# disk although it debates nothing.
copy_parent = true

[grading]
# The same Haiku on the ordinary chat-completions endpoint, for `ruling_agreement` and for
# the FINDINGS grader. It is NOT used by `agreement` on this arm — that instrument is
# mechanical here. Held equal to F-weak's and to every earlier run's so the ruling-line
# residual stays measured by the same reader. No `anthropic/*` judge or challenger for the
# same reason: a party graded by itself is a confound `DESIGN.md` names.
grader_model = "anthropic/claude-haiku-4.5"
