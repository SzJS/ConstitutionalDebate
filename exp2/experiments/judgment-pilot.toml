# The judgment-challenge validation slice: pilot 3's 69 items, all seven subsets, 207 cells.
#
# THE VARIANT. The challenger is not asked whether the verdict is right. It audits the
# JUDGMENT — the judge's reasoning in `debate`, the reviewer's justification in `single`,
# the final revision's grounds in `self_critique` — against the published record, for
# three defect types: a self-contradiction, a misstatement of the record, or an omission
# (a point made in the record that bears on the verdict and the judgment does not
# address). Object-level truth is explicitly out of scope: it may not argue the physics,
# the law or the code, and an error the judgment inherits from the record is not a defect
# of the judgment (DESIGN.md, `## Judgment-challenge`).
#
# Why it is worth $1 to find out. Every arm run so far asks a weak reader to re-solve a
# graduate problem before it may disagree with a verdict, and the sweep measured what
# that produces: deference, and phantoms in half of what is left. This asks a question a
# weak reader can actually answer — does this reasoning say true things about that
# transcript — and it measures the transparency claim directly, because `debate`'s record
# gives a misquote or an ignored rebuttal somewhere to live and `single`'s 150-word
# justification gives almost nothing.
#
# What that changes downstream, all of it keyed off `challenger_variant = "judgment"`:
#
#   * the objection is a numbered defect list, each defect quoting the judgment and the
#     record, closing on the same `Decision: STANDS|REVERSE` line as every other arm;
#   * the `agreement` stage asks its question about the JUDGMENT (does this text identify
#     at least one defect) rather than about the verdict;
#   * the grade is a JUDGMENT AUDIT: each alleged defect is checked against the record by
#     the grader, with `flaw.json` never opened — so every subset is gradable, gpqa
#     included, and validity is defined on sound items and on CORRECT decisions too. Every
#     contested cell is graded, and a valid defect on a correct decision is a real finding
#     and not a false alarm. The analysis says so in a caveat of its own.
#
# This spec CONTESTS decisions; it does not make any. `decisions_from` names the tree
# whose decisions are read — nothing under it is ever written to — and this run writes
# only its own contests, rulings, agreements, grades and index. `--stage decide` refuses
# on a spec with that key.
#
#     RUN_SWEEP_STAGES="contest agreement ruling_agreement grade analyse" nohup \
#         scripts/run_sweep.sh experiments/judgment-pilot.toml > outputs/judgment-pilot-driver.log 2>&1 &
#
# The comparison run is `rerule-recontest` restricted to these same cells — neutral
# objections, the corrected ruling line, the `ruling_agreement` instrument present. Note
# what is and is not comparable: the objection RATE here is not a detection rate and is
# not the neutral run's quantity, because this challenger was asked a different question.
# The recourse-stage quantities are comparable, and the valid-objection rate is a new one.
#
# READ FIRST: ../HANDOFF.md section 5 for the run order and the stop triggers.
#
# 69 items x 3 conditions = 207 cells, of which the sweep decided 194; the rest were lost
# to truncation there and are skipped here with `no decision to contest`.
# `data/cases/pilot-3.jsonl` is a strict subset of `ftf-all.jsonl`, so every cell here is
# already decided in the sweep tree. ~$1 and ~10 minutes. Its job is the user's gate: does
# the challenger raise objections against judgments at all, and are any of them graded
# valid — checked by hand as well as by the numbers — before the full corpus is run.
#
name = "judgment-pilot"
cases = "data/cases/pilot-3.jsonl"
decisions_from = "outputs/experiments/sweep"
conditions = ["single", "self_critique", "debate"]
repeats = 1

[debate]
# The decision-path models are copied from `sweep.toml` unedited, even though this run
# makes no decisions: they are what `config.json` will say a re-contested cell was
# decided by, and a spec that quietly differed from the tree it reads would make the
# record wrong about its own provenance.
debater_model    = "deepseek/deepseek-v4-flash-0731"
judge_model      = "openai/gpt-4.1-nano"
challenger_model = "openai/gpt-4.1-nano"

# THE VARIANT, and the only setting in this file that differs from `recontest.toml`'s. It
# selects the challenger's whole task — its system prompt, its objection format, the
# `agreement` question asked of its prose, and which grader reads it — and nothing else:
# the flaw definition, the record it is shown, the length rule, the two-section format
# and the decide-last `Decision: STANDS|REVERSE` line are shared with the neutral arm. It
# is written into every `challenge.json` as `arm` and into `index.jsonl` as
# `challenge_arm`, and every `grade.json` it produces carries `mode = "judgment"`.
challenger_variant = "judgment"

# Every condition's objection is ruled by a third party — the weak recourse judge — so no
# decider adjudicates its own appeal. Unchanged from `recontest.toml`: the recourse
# mechanism is not what this run varies, and holding it fixed is what makes the recourse
# metrics comparable with the neutral run's.
recourse_form = "third_party"

# Stated rather than inherited, because under `third_party` it is no longer debate's
# judge alone: it is the one party that hears every appeal in the experiment. Unset it
# would mean `judge_model`, which is this same weak model — the value is identical and
# the point is that it is now visible.
recourse_judge_model = "openai/gpt-4.1-nano"

# Unchanged from `sweep.toml`. The cap for the roles that emit a decision line -- judge,
# challenger, recourse judge, comprehension probe -- none of which has truncated in four
# runs.
max_tokens = 16384

# Unchanged from `sweep.toml`. The cap for the roles that produce record text: debaters,
# the solo stages, the critic. Nothing here generates record text, but the value is what
# the copied decision was made under and is kept for that reason.
generation_max_tokens = 8192

# Unchanged. The challenger is the role under measurement: at 0 every stakeholder writes
# the same objection, and variance across objections is part of the result.
challenger_temperature = 0.7

# --- provider routing ----------------------------------------------------------------
# Copied from `sweep.toml` unedited. It binds the strong model, which this run does not
# call; the challenger and the recourse judge are gpt-4.1-nano and are unpinned, as they
# were in every run so far. Verify the slugs before any run that does call the strong
# model:
#     uv run python records/derivations/sweep-1-provider-check.py <spec>
[debate.provider_order]
"deepseek/deepseek-v4-flash-0731" = ["gmicloud/fp8", "coreweave/fp8"]
# provider_allow_fallbacks stays at its default False. No fallback is added to make a
# row pass; a pin that silently falls back is not a pin.

[client]
# 16/8, as the sweep proved. The contest stages are two or three short nano calls per
# cell where `decide` was up to seven strong-model ones, so this is if anything
# conservative here.
max_concurrency = 16
max_runs_in_flight = 8

# Each contest directory carries a full copy of the decision it contests — read out of
# the SOURCE tree and written into this one. That is what makes a contest record
# self-contained, and it is why this tree costs disk although it decides nothing.
copy_parent = true

[grading]
# The same Haiku on the ordinary chat-completions endpoint, for the `agreement` stage
# that reads line against prose and for the grader — which under this variant is the
# JUDGMENT grader, checking each alleged defect against the record. It is the new
# instrument in this run, which is why the plan has it hand-checked on 30 rows before any
# number it produces is believed. Held equal to the neutral run's so the phantom rate
# stays measured by the same reader.
grader_model = "anthropic/claude-haiku-4.5"
