# THE SMOKE FOR TWO PROMPT CHANGES. Six debate cells, ~$0.15, ~1 minute. It is a PROMPT
# CHECK AND NOT A MEASUREMENT: six cells cannot measure a raise rate, a valid-objection
# rate or an overturn rate, and no number out of this tree belongs in a table beside the
# pilots. The house rule is that a new or changed prompt is read on ~6 chosen examples
# before any slice, and this is that reading.
#
# WHAT CHANGED, both since `judgment-debate-pilot` and both being checked here at once.
#
#   1. THE CHALLENGER'S FORMAT INSTRUCTION (`CHALLENGE_DECISION_INSTRUCTION_JUDGMENT`).
#      Flash needed a format repair on 59 of the pilot's 60 objections — `no_public_label`
#      35, `label_not_at_line_start` 24. Reading the raw first attempts shows one shape
#      behind both counts: it opens a correctly labelled `Thinking:` block, audits at
#      length inside it, and runs into the numbered list without ever writing `Argument:`
#      on a line of its own. The shown template began at `1. Type:`, so a reply that
#      copied it faithfully had no label; the label is now at the head of that template
#      and is demanded in prose. Format only — the three defect types, the four field
#      names, the quoting rule, the omission carve-out and the `Decision:` line are
#      byte-identical, so nothing the grader or `parse_defects` reads has moved.
#
#      This is not only a cost. Every repaired objection came back
#      `parse_mode = "salvaged_no_thinking"`: the repair instruction suppresses the
#      private section, so the objection the grader read was a SECOND attempt written
#      under a different instruction, and the first attempt's working was discarded.
#
#   2. THE RECOURSE JUDGE'S RULING PROMPT, for this arm only
#      (`RECOURSE_JUDGE_USER_JUDGMENT`). The object-level prompt tells the judge "not on
#      the objection and not on the decision's reasoning" — right for the neutral arm,
#      where the objection is a claim about the text, and exactly wrong here, where the
#      objection is a claim about the judgment. The pilot measured what filled the gap:
#      nano re-solved the object-level question with the objection as a nudge and
#      overturned 20 of 45, 35% of them on decisions that were CORRECT, reaching the same
#      net outcome (11 fixed / 9 broken) that nano's own junk objections had produced
#      (12/10) — from objections 37 of which were graded valid with zero invented
#      quotations. The judge now rules in two steps: is each alleged defect real, checked
#      against the record and quoted; and if so, does addressing it change what is true of
#      the text. If none is real, or none material, the decision stands.
#
#      The template is keyed on the OBJECTION's arm, so the neutral arm — including
#      `rerule-recontest`, the third paired arm of the full run — is ruled in the form its
#      objections were written for, byte for byte. `ruling_prompt_form` in the index says
#      which prompt ruled.
#
# THE SIX CELLS, picked by `records/derivations/judgment-debate-smoke-pick.py` and
# written to `data/cases/judgment-debate-smoke.jsonl`: 2 omission-only objections, 2
# misstatement objections, 2 substantive declines; 4 decisions the sweep got wrong and 2
# it got right; five subsets. Every one needed exactly ONE format repair in the pilot, so
# the before figure is a clean 6 of 6.
#
#     RUN_SWEEP_STAGES="contest ruling_agreement" nohup \
#         scripts/run_sweep.sh experiments/judgment-debate-smoke.toml \
#         > outputs/judgment-debate-smoke-driver.log 2>&1 &
#
# `contest` performs the ruling as well as the objection, so those two stages are the
# whole of it. No `agreement` and no `grade`: the phantom rate and the valid-objection
# rate are measurements, this is not a measurement, and neither instrument bears on
# either question above.
#
# READ FIRST: ../HANDOFF.md section 5 for the run order and the stop triggers.
#
name = "judgment-debate-smoke"
cases = "data/cases/judgment-debate-smoke.jsonl"
decisions_from = "outputs/experiments/sweep"

# ONE CONDITION, and it is the whole point. `single` and `self_critique` are not run
# because the procedure under test is not defined for them, not because they lost a
# comparison. All six cases are drawn from `pilot-3.jsonl`, itself a strict subset of
# `ftf-all.jsonl`, and all six were decided by the sweep — so six cells are attempted
# and six are contested.
conditions = ["debate"]
repeats = 1

[debate]
# The decision-path models are copied from `sweep.toml` unedited, even though this run
# makes no decisions: they are what `config.json` will say a re-contested cell was
# decided by, and a spec that quietly differed from the tree it reads would make the
# record wrong about its own provenance.
debater_model    = "deepseek/deepseek-v4-flash-0731"
judge_model      = "openai/gpt-4.1-nano"

# THE ONE MODEL THAT DIFFERS FROM `judgment-pilot.toml`, and the disclosed departure
# above. `openai/gpt-4.1-nano` audited these judgments and could not: 57% of its
# objections were raised, 6% held up, and in a hand read of 66 of its `Judgment says:`
# quotations 34 were not in the judgment at all. The probe was commissioned to replace
# it, pre-registered its floors, and picked nobody; flash is the best of the six on
# debate judgments and is chosen after the numbers. It is UNPINNED and runs with
# `reasoning_effort = "off"` — verified live on 2026-08-27
# (`outputs/pick-auditor/liveness.json`), which is what excluded every Pro-class Gemini
# and `gemini-3.7-flash`: they answer `HTTP 400: Reasoning is mandatory for this
# endpoint and cannot be disabled`, and a challenge written partly in a provider channel
# no reader can inspect is what the transparency claim rules out.
challenger_model = "google/gemini-2.5-flash"

# THE VARIANT. It selects the challenger's whole task — its system prompt, its objection
# format, the `agreement` question asked of its prose, and which grader reads it — and
# nothing else: the flaw definition, the record it is shown, the length rule, the
# two-section format and the decide-last `Decision: STANDS|REVERSE` line are shared with
# the neutral arm. It is written into every `challenge.json` as `arm` and into
# `index.jsonl` as `challenge_arm`, and every `grade.json` it produces carries
# `mode = "judgment"`.
challenger_variant = "judgment"

# Every condition's objection is ruled by a third party — the weak recourse judge — so no
# decider adjudicates its own appeal. Unchanged from `judgment-pilot.toml`, and it is
# what makes the neutral arm (`rerule-recontest`, same judge, same corrected line) a
# paired comparison rather than a different mechanism.
recourse_form = "third_party"

# Stated rather than inherited, because under `third_party` it is no longer debate's
# judge alone: it is the one party that hears every appeal in the experiment. Unset it
# would mean `judge_model`, which is this same weak model — the value is identical and
# the point is that it is now visible. It is also the residual asymmetry the analysis
# caveat names: this judge decided the debate condition and now rules on its appeal.
recourse_judge_model = "openai/gpt-4.1-nano"

# Unchanged from `sweep.toml`. The cap for the roles that emit a decision line -- judge,
# challenger, recourse judge, comprehension probe -- none of which has truncated in four
# runs.
max_tokens = 16384

# Unchanged from `sweep.toml`. The cap for the roles that produce record text: debaters,
# the solo stages, the critic. Nothing here generates record text, but the value is what
# the copied decision was made under and is kept for that reason.
generation_max_tokens = 8192

# Unchanged. The challenger is the role under measurement: at 0 every stakeholder writes
# the same objection, and variance across objections is part of the result.
challenger_temperature = 0.7

# --- provider routing ----------------------------------------------------------------
# Copied from `sweep.toml` unedited. It binds the strong model, which this run does not
# call; the challenger (`google/gemini-2.5-flash`) and the recourse judge
# (`gpt-4.1-nano`) are not in this table and so are unpinned, as every challenger in
# every run so far has been. Verify the slugs before any run that does call the strong
# model:
#     uv run python records/derivations/sweep-1-provider-check.py <spec>
[debate.provider_order]
"deepseek/deepseek-v4-flash-0731" = ["gmicloud/fp8", "coreweave/fp8"]
# provider_allow_fallbacks stays at its default False. No fallback is added to make a
# row pass; a pin that silently falls back is not a pin.

[client]
# 16/8, as the sweep proved. The contest stages are two or three short calls per cell
# where `decide` was up to seven strong-model ones, so this is if anything conservative
# here.
max_concurrency = 16
max_runs_in_flight = 8

# Each contest directory carries a full copy of the decision it contests — read out of
# the SOURCE tree and written into this one. That is what makes a contest record
# self-contained, and it is why this tree costs disk although it decides nothing.
copy_parent = true

[grading]
# The same Haiku on the ordinary chat-completions endpoint, for the `agreement` stage
# that reads line against prose, for the `ruling_agreement` stage that reads the
# recourse judge's line against its prose, and for the grader — which under this variant
# is the JUDGMENT grader, checking each alleged defect against the record. Held equal to
# the neutral run's so the phantom rate and the ruling-line residual stay measured by
# the same reader. No `anthropic/*` challenger for the same reason: a challenger graded
# by itself is a confound `DESIGN.md` names.
grader_model = "anthropic/claude-haiku-4.5"
