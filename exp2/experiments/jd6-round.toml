# jd6, ARM R of 2 — THE CONTESTABILITY DEBATE ROUND on M1's 896 real objections.
#
# READ FIRST: `records/experiments/judgment-debate-6/PREREG.md`, to be committed before
# this arm's first paid call. The population, the two pre-registered endpoints (P1, P2),
# the four named outcomes, the stated caveat, the ablations and the stop rules are all
# there and none of them is restated here.
#
# WHAT IS NEW AND IT IS THE WHOLE POINT. Every recourse number this campaign has produced
# comes from an exchange between two WEAK parties with nobody answering: gemini-2.5-flash
# writes an objection to Maverick's judgment and Maverick rules on it alone. On these 896
# objections that judge overturns 34.7%, fixes 52.6% of the wrong decisions it is put to
# and breaks 26.8% of the right ones (`LLM_NOTES.md` §3aa). The user's hypothesis is that
# recourse fails because it is weak-vs-weak. So this arm puts a REPLY in front of the
# judge: after the objection is raised the two ORIGINAL, strong debaters each argue once,
# simultaneously, whether it should change the ruling, and the same weak judge rules on
# the argued exchange. `recourse_rounds = 1` is the only line of this spec that differs in
# effect from `jd5-recheck-real.toml`.
#
# WHO ARGUES WHAT IS DERIVED, NEVER STORED (`types.recourse_stance`): the debater whose
# assigned side the decision went AGAINST argues that the alleged defects are real and
# material; the winner argues that they are not. Each still argues its own assigned side,
# so neither has to attack the case it spent three rounds making. One simultaneous turn
# each, like rounds 1-3, so there is no speaking-order confound.
#
# THE BASELINE IS `jd6-plain.toml` and it is the arm this one is only readable against:
# the same 896 cells, the same debaters, one more ORDINARY round with no objection
# anywhere, re-judged by the same Maverick. The endpoint is whether the contest round
# BREAKS FEWER right decisions than the plain round while FIXING AT LEAST AS MANY wrong
# ones — not the net, which is dominated by the 26% base rate of wrong decisions.
#
# NOTHING IS GENERATED BY THE CHALLENGER AND NO DECISION IS RE-MADE. `--stage rerule`
# copies each source contest here minus its ruling, keeps the source ruling beside the new
# one as `ruling.source.json`, buys TWO debater calls (the round) and ONE recourse-judge
# call per contested cell. `contest`, `agreement` and `grade` all REFUSE. `decisions_from`
# and `contests_from` are the SAME tree because M0 and M1 are one tree by construction,
# and nothing under it is written — `jd3-main dfa9bdca…` before and after, asserted by
# `outputs/jd6-run-all.sh`.
#
#     RUN_SWEEP_CMD="uv run exp2-experiment --retry-failed" \
#     RUN_SWEEP_STAGES="rerule ruling_agreement analyse" nohup \
#         scripts/run_sweep.sh experiments/jd6-round.toml \
#         > outputs/jd6-round-driver.log 2>&1 &
#
# WHAT THIS SPEC ACTUALLY SPENDS, and it is not the `--dry-run` total. That figure is a
# per-stage BOUND for every stage that could be run against this tree; the driver runs
# THREE — `rerule ruling_agreement analyse` — and the calls they make are:
#
#     1,792  round-4 debater turns   (2 per contested cell, deepseek, the expensive term)
#     <=896  recourse-judge rulings  (1 per contested cell, Maverick)
#     <=896  ruling_agreement reads  (1 per ruling, Haiku; off the decision path)
#     ----
#     ~3,584 calls.  `analyse` makes none.
#
# `contest`, `agreement` and `grade` all REFUSE on this spec, so their terms in the
# estimate are bounds on stages nobody will run. `planned_stages` below is echoed by
# `--dry-run` so the reader agreeing to the spend sees which is which.
#
# MEASURED FROM THE SMOKE (`outputs/jd6-smoke-cost.txt`, 6 cells): $0.005482/cell for the
# two debater turns, $0.001629 for the ruling and $0.002015 for the reading — $0.009126
# per cell, so **about $8.2** over 896 cells, and about **$11** with 1.3x headroom.
#
# RESUME AND RETRY, stated because the round changes what a retry costs. `rerule` takes
# NO `--retry-failed`: its only skip is "this cell already holds a `ruling.json`"
# (`experiment.py::run_stage_rerule`), so a cell whose round or whose ruling FAILED is
# re-attempted on every resume, with or without the flag, and BOTH round-4 turns are
# bought again. There is no half-round resume — ruling on one stored reply and one fresh
# one would be a different protocol wearing this one's name — and a cell that fails twice
# is counted and reported by the stage summary and by `outputs/jd6-run-all.sh`, never
# silently skipped.

name = "jd6-round"

# THE WHOLE DEBATE GRID, as `jd5-recheck-real.toml` runs it — 2,110 items, of which the
# sweep decided 1,644 and M1 contested 896. The cases file is the corpus rather than the
# 896-cell file because this arm re-rules M1 in its own tree and the rerule stage skips
# every cell with no source objection; taking the population from the cases file instead
# would silently drop M1's declines from the denominator of the raise rate the index
# prints. (`jd6-plain.toml` DOES take the 896-cell file, because a rejudge has no
# objection to gate on and would otherwise extend all 1,644.)
cases = "data/cases/ftf-all.jsonl"

# M0's decisions and M1's objections are the same tree. Read-only, both.
decisions_from = "outputs/experiments/jd3-main"
contests_from = "outputs/experiments/jd3-main"

conditions = ["debate"]
repeats = 1

# THE STAGES THIS SPEC'S DRIVER RUNS, stated so `--dry-run` can echo it. The estimate
# above it prints a per-stage BOUND for every stage that could ever be run against this
# tree, which is right for a spec and wrong for a bill: the total counts contest, grade
# and agreement terms this driver never invokes.
planned_stages = ["rerule", "ruling_agreement", "analyse"]

[debate]
# Byte-identical to `jd3-main.toml`'s decision-path block. The debaters ARE called by this
# spec — that is the arm — and they are called at exactly the settings the debate they are
# continuing was argued under; `recourse.hear_exchange` refuses the cell if any of them
# differs, rather than splicing a turn by a different party into the record.
debater_model    = "deepseek/deepseek-v4-flash-0731"
judge_model      = "meta-llama/llama-4-maverick"
challenger_model = "google/gemini-2.5-flash"

# The real audit's variant, stated because this spec re-rules its objections and the index
# has to say `challenge_arm = "judgment"` rather than inherit the neutral default. No
# challenger call is made: the objections are M1's, copied.
challenger_variant = "judgment"

recourse_form = "third_party"

# THE ONE LINE THAT MAKES THIS ARM WHAT IT IS. 1 = the contestability debate round; 0 is
# what jd3, jd4 and jd5 all ran and is what `jd5-recheck-real.toml` still says. Validated
# to (0, 1) and refused on any condition but `debate`, which has advocates to argue with.
recourse_rounds = 1

# The same judge that judged these debates and ruled these objections the first time.
recourse_judge_model = "meta-llama/llama-4-maverick"

max_tokens = 16384
generation_max_tokens = 8192
challenger_temperature = 0.7

# --- provider routing ----------------------------------------------------------------
[debate.provider_order]
# The debaters', unchanged from `sweep.toml` and `jd3-main.toml`. It binds the round-4
# turns, which are the only strong-model calls this arm makes.
"deepseek/deepseek-v4-flash-0731" = ["gmicloud/fp8", "coreweave/fp8"]
# THE JUDGE, PINNED — new in this campaign and it is not cosmetic. §3aa found 34% of M1's
# rulings served by DeepInfra against 4.8% of jd5-B's, so an unpinned judge makes "only
# the round moved" an intent rather than a fact. `digitalocean` is the slug OpenRouter's
# endpoint list gives for the provider that served 680-758 of the ~900 Maverick calls in
# every jd5 arm, verified by one real pinned call
# (`records/derivations/jd6-provider-check.py`, `outputs/jd6-provider-check.log`).
# `provider_allow_fallbacks` stays False: a pin that silently falls back is not a pin.
"meta-llama/llama-4-maverick" = ["digitalocean"]

[client]
max_concurrency = 16
max_runs_in_flight = 8
copy_parent = true

[grading]
# For `ruling_agreement` only. The `grade` stage REFUSES on this spec: M1's grades came
# across with the copy and are the same grades `judgment-debate-3` reported.
grader_model = "anthropic/claude-haiku-4.5"
