# jd3 PILOT — ONE JUDGE THROUGHOUT, on the 60 pilot-3 debate cells. ~$2.
#
# THE DESIGN THIS PILOT INSTRUMENTS, in one paragraph. The debate-only judgment-challenge
# run (`records/experiments/judgment-debate/`) used `openai/gpt-4.1-nano` as BOTH the
# debate judge and the recourse judge and netted +45 (p = 0.0111). The follow-up chain
# re-ruled those same objections with two flash-class judges and got Maverick +124 and
# gpt-4.1-mini +114 — but those judges are STRONGER than the nano that judged the
# debates, so "debate + recourse beats debate alone" could be nothing more than "a better
# judge re-decided". The user's decision was to REMOVE THE ASYMMETRY RATHER THAN MODEL IT:
# re-run the whole debate-only design with `meta-llama/llama-4-maverick` as the debate
# judge AND the recourse judge. The before-state is no longer the sweep's nano judgment;
# it is Maverick's own reading of the same stored transcripts (arm M0), and the audit runs
# on Maverick's judgments and is ruled by Maverick (arm M1).
#
# THE SAME-MODEL PROPERTY, STATED UP FRONT because it is a property of the design and not
# a defect of it: the model that judges the debate is the model that rules on the appeal
# against its own judgment. That is exactly what the FIRST run had with nano, and it is
# what the two ablations bound — a placeholder objection (M2) says what the same judge
# does on a second look with no information, and a specious objection (M3) says what it
# does when the information is wrong. `DESIGN.md`, `## Challenger and judge model
# variance`. Nothing here hides it and the write-up states it beside every number.
#
# WHY MAVERICK. `records/experiments/judgment-debate-2/PREREG.md` (`## Judge selection
# rule`): the candidate set is every model within +/-5 index points of the challenger's
# own non-reasoning index of 14 that runs with `reasoning_effort = "off"`, excluding the
# debaters' family (deepseek), the challenger's (google) and the grader's (anthropic).
# Maverick is index 14 — EXACTLY the challenger's level, delta 0 — passed the mechanical
# rule on 82 stored objections (strict ruling-line mismatch 5.3% against nano's 9.5%,
# discrimination +45.3 pts against nano's +36.7, the highest net of the two eligible
# candidates), and is a FOURTH model family: Meta, distinct from the debaters' DeepSeek,
# the challenger's Google and the grader's Anthropic. `openai/gpt-4.1-mini` was the other
# eligible candidate and shares OpenAI with the judge being replaced.
#
# WHAT THIS PILOT GATES, and it is the instrument and not the result:
#
#   1. DOES MAVERICK JUDGE THE DEBATE? Ten of its judgments are read against the
#      transcript's last round by hand. It must weigh the arguments rather than re-solve
#      the problem from scratch, and it must land the `Verdict:` line cleanly — the
#      judgment is the document the whole audit is of, so a judge that answers before it
#      explains leaves the auditor nothing to audit.
#   2. DOES IT PARSE AND SURVIVE THE CAP? Truncation and parse counts on 60 judgments,
#      against the sweep's own experience with nano. A judgment that truncates or will not
#      parse is COUNTED AND LEFT UNDECIDED, exactly as the sweep did — the harness makes
#      one attempt plus one format repair and never a second draw.
#   3. DOES THE AUDIT STILL HOLD ON A DIFFERENT JUDGE'S JUDGMENTS? Ten
#      objection + grade + ruling triples are read by hand — five overturns, five upholds.
#      Raise rate, valid-objection rate, misattributed quotes, phantom contests,
#      `ruling_line_mismatch` strict and conservative, all beside pilot 2's nano numbers.
#   4. WHAT DOES THE FULL RUN COST AND HOW LONG DOES IT TAKE? Per-stage spend on 60 cells
#      scaled to the 1,644 the main arms run on, with Maverick's measured p95.
#
# It is NOT a gate on the endpoint. Sixty cells measure no accuracy difference, and no
# number from this tree is quoted as a result.
#
# WHAT DIFFERS FROM `judgment-debate-pilot-2.toml`, and it is TWO MODELS AND ONE KEY:
#
#   * `judge_model` is Maverick rather than nano, and the run now has a `rejudge` stage
#     that makes the judgments this spec's `judge_model` names. Every other decision-path
#     setting — the debaters, the pin, the temperatures, the caps, the seed — is copied
#     from `sweep.toml` unedited, because they are what the copied transcripts were
#     ARGUED under and `config.json` has to be true about its own provenance.
#   * `recourse_judge_model` is Maverick rather than nano, which is the whole point: one
#     judge throughout.
#   * `transcripts_from` replaces `decisions_from`. The sweep's stored debate transcripts
#     are read and judged again into THIS tree, which then holds ordinary decision records
#     — so `contest`, `agreement`, `ruling_agreement`, `grade` and `analyse` run over it
#     with nothing changed, and the main arms' M2/M3 specs will read it through
#     `decisions_from` unchanged. Nothing under `outputs/experiments/sweep` is written:
#     it is fingerprinted before and after.
#
# The challenger, the grader, the format-revised judgment prompt, the materiality ruling
# prompt, the ruling reader, the recourse form and every client setting are BYTE-IDENTICAL
# to pilot 2's, so the two are comparable on everything except the judge.
#
#     RUN_SWEEP_STAGES="rejudge contest agreement ruling_agreement grade analyse" nohup \
#         scripts/run_sweep.sh experiments/jd3-pilot.toml \
#         > outputs/jd3-pilot-driver.log 2>&1 &
#
# READ FIRST: ../HANDOFF.md section 5 for the run order and the stop triggers.
#
name = "jd3-pilot"
cases = "data/cases/pilot-3.jsonl"

# THE TRANSCRIPTS, NOT THE DECISIONS. `data/cases/pilot-3.jsonl` is a strict subset of
# `ftf-all.jsonl`, so all 69 debate cells were attempted in the sweep and 60 were decided;
# the 9 the sweep lost to truncation have no transcript and are skipped here with `no
# source decision to re-judge`. `--stage decide` refuses on this key — it would re-run the
# debates, which is the one thing the design holds fixed.
transcripts_from = "outputs/experiments/sweep"

# ONE CONDITION, and it is the whole point — twice over. Only a debate publishes a
# judgment that is a document other than the decision itself, so the audit is defined
# here and undefined in the other two; and only a debate leaves a record a SECOND JUDGE
# can be handed without re-running the decision, which is what `rejudge` needs. `single`
# and `self_critique` reach their verdict inside the conversation that wrote the record.
conditions = ["debate"]
repeats = 1

[debate]
# Copied from `sweep.toml` unedited. This run makes no debater call — the transcripts are
# the sweep's — but these are what `config.json` will say the copied debate was argued
# under, and a spec that quietly differed from the tree it reads would make the record
# wrong about its own provenance.
debater_model    = "deepseek/deepseek-v4-flash-0731"

# THE ONE DECISION-PATH MODEL THAT DIFFERS FROM `sweep.toml`, AND THE REASON THIS TREE
# EXISTS. The sweep's 1,644 debate judgments were made by `openai/gpt-4.1-nano`; this run
# re-judges the stored transcripts with `meta-llama/llama-4-maverick`, at the challenger's
# own level and from a fourth model family, and everything downstream audits and rules on
# THOSE judgments. It is UNPINNED, as every judge and challenger in every run so far has
# been, and it runs with `reasoning_effort = "off"` — verified live on 2026-08-28
# (`outputs/jd3-liveness.log`: PASS, 0 reasoning tokens, 0.33 s, DeepInfra).
judge_model      = "meta-llama/llama-4-maverick"

# Unchanged from pilot 2 and from the finished run. The auditor probe's pre-registered
# rule picked nobody and flash was chosen after the numbers — a disclosed departure that
# stands in `records/pick-auditor/DECISION.md`, in the pre-registration and in the
# write-up. It is at index 14 with reasoning off, which is the level the judge above was
# selected to match.
challenger_model = "google/gemini-2.5-flash"

# THE VARIANT, byte-identical to pilot 2's. It selects the challenger's whole task — its
# system prompt, its objection format, the `agreement` question asked of its prose, which
# grader reads it, and (through the objection's arm) the MATERIALITY ruling prompt and the
# materiality ruling reader. The challenger audits the JUDGMENT — here Maverick's — against
# the published record for a contradiction, a misstatement or an omission, quoting both
# sides of each, and is forbidden the object level.
challenger_variant = "judgment"

# Every condition's objection is ruled by a third party rather than by the decider
# re-deciding in its own conversation. Unchanged from pilot 2. Note what it does NOT mean
# here: the third party is the same MODEL as the judge, by design (see the header).
recourse_form = "third_party"

# ONE JUDGE THROUGHOUT. Stated rather than left to inherit `judge_model`, even though the
# value is identical, because the whole design is that these two are now deliberately the
# same and a reader of `config.json` must see it said. This is the same-model property the
# first run had with nano; the placeholder and specious ablations are what bound it.
recourse_judge_model = "meta-llama/llama-4-maverick"

# Unchanged from `sweep.toml`. The cap for the roles that emit a decision line -- judge,
# challenger, recourse judge, comprehension probe -- none of which has truncated in five
# runs.
max_tokens = 16384

# Unchanged from `sweep.toml`. The cap for the roles that produce record text: debaters,
# the solo stages, the critic. Nothing here generates record text, but the value is what
# the copied debate was argued under and is kept for that reason.
generation_max_tokens = 8192

# Unchanged. The challenger is the role under measurement: at 0 every stakeholder writes
# the same objection, and variance across objections is part of the result.
challenger_temperature = 0.7

# --- provider routing ----------------------------------------------------------------
# Copied from `sweep.toml` unedited. It binds the strong model, which this run does not
# call at all — the debates are read from disk. The judge (`meta-llama/llama-4-maverick`),
# the challenger (`google/gemini-2.5-flash`) and the grader are not in this table and so
# are unpinned. Verify the slugs before any run that does call the strong model:
#     uv run python records/derivations/sweep-1-provider-check.py <spec>
[debate.provider_order]
"deepseek/deepseek-v4-flash-0731" = ["gmicloud/fp8", "coreweave/fp8"]
# provider_allow_fallbacks stays at its default False. No fallback is added to make a
# row pass; a pin that silently falls back is not a pin.

[client]
# 16/8, as the sweep proved. Every stage here is one to three short calls per cell where
# `decide` was up to seven strong-model ones, so this is if anything conservative.
max_concurrency = 16
max_runs_in_flight = 8

# Each contest directory carries a full copy of the decision it contests — here a
# re-judged decision, which itself carries the copied transcript and the debate's own wire
# log. That is what makes a contest record self-contained, and it is why this tree costs
# disk although it debates nothing.
copy_parent = true

[grading]
# The same Haiku on the ordinary chat-completions endpoint, for the `agreement` stage that
# reads the challenger's line against its prose, for the `ruling_agreement` stage that
# reads the recourse judge's line against its prose, and for the JUDGMENT grader that
# checks each alleged defect against the record. Held equal to pilot 2's so the phantom
# rate and the ruling-line residual stay measured by the same reader. No `anthropic/*`
# challenger or judge for the same reason: a party graded by itself is a confound
# `DESIGN.md` names.
grader_model = "anthropic/claude-haiku-4.5"
