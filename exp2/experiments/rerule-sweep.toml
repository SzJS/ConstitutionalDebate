# The first full sweep's 1,122 rulings, made again by the third-party judge.
#
# READ FIRST: ../HANDOFF.md section 5 for the run order and the stop triggers.
#
# WHAT THIS SPEC MAKES, AND WHAT IT ONLY READS. It makes RULINGS and nothing else.
# `decisions_from` names the tree whose decisions are read; `contests_from` names the
# tree whose OBJECTIONS are read. Nothing under either is ever written to. Each source
# contest directory is copied into this tree minus its ruling, its wire log and its two
# documents, the old ruling is kept beside the new one as `ruling.source.json`, and one
# call is made per contested cell. `decide`, `contest`, `agreement` and `grade` all
# refuse on this spec: the objection and its grade came across with the copy, and
# regenerating either would change the population as well as the ruling.
#
# WHY. The re-contest's hand check (`outputs/recontest-ruling-handcheck.md`) found the
# recourse judge's `Ruling: UPHOLD|OVERTURN` line contradicting the judge's OWN reasoning
# in 8 of 12 rulings on FLAWED parents, and 52 of the 62 phantom objections — objections
# whose prose agreed with the verdict — overturned. It is the pilot-2 vocabulary
# collision one layer down: "the objection is valid" and "the text is flawed" both land
# on OVERTURN whichever way the decision went. The judge is now asked what is true of the
# ORIGINAL text and UPHOLD/OVERTURN is derived from that (DESIGN.md, `### Recourse
# mechanisms`); the three-variant smoke that chose the wording is in
# `outputs/rerule-smoke/review.md`, where variant C scored 1 line-vs-prose contradiction
# in 20 against the old line's 8.
#
# The `ruling_agreement` stage measures the residual: a grader-model reading of the
# judge's own prose against the line, exactly as `agreement` reads the challenger's. It
# is what bounds every `revised_*` number this run produces.
#
#     RUN_SWEEP_STAGES="rerule ruling_agreement analyse" nohup \
#         scripts/run_sweep.sh experiments/rerule-sweep.toml > outputs/rerule-sweep-driver.log 2>&1 &
#
# THE CASES, AND WHY THIS RUN IS DIFFERENT FROM `rerule-recontest`. Both sources are the
# SWEEP: its decisions and its own objections. The sweep ruled under the historical
# `per_condition` routing — `debate`'s 440 objections by the weak third-party judge
# (`uphold_overturn`, the defective line), and `single`/`self_critique`'s 682 by the
# STRONG model re-deciding in its own conversation (`restated_verdict`, which was never
# asked a relative question). Ruling all 1,122 here with the one weak third-party judge
# does two things at once: it replaces debate's unreliable rulings, and it gives the
# paired strong-re-decider vs weak-third-party-judge comparison on 682 IDENTICAL
# objections, which is the only clean handle on the recourse confound the sweep's
# asymmetry left behind.
#
# The 7 cells whose sweep ruling is null are included: they carry a challenge whose
# stance is `contests`, so there is an objection to rule.
#
# ~1,122 nano rulings + ~1,122 Haiku readings. Roughly a dollar, under an hour.
#
name = "rerule-sweep"
cases = "data/cases/ftf-all.jsonl"
decisions_from = "outputs/experiments/sweep"
contests_from = "outputs/experiments/sweep"
conditions = ["single", "self_critique", "debate"]
repeats = 1


[debate]
# The decision-path models are copied from `sweep.toml` unedited, even though this run
# makes no decisions: they are what `config.json` will say a re-contested cell was
# decided by, and a spec that quietly differed from the tree it reads would make the
# record wrong about its own provenance.
debater_model    = "deepseek/deepseek-v4-flash-0731"
judge_model      = "openai/gpt-4.1-nano"
challenger_model = "openai/gpt-4.1-nano"

# THE CHANGE. Every condition's objection is ruled by a third party — the weak recourse
# judge — so no decider adjudicates its own appeal. The sweep ran the historical
# `per_condition` routing: `debate` by that judge, `single` and `self_critique` by the
# strong model re-deciding in its own conversation. The two are not the same instrument.
# The judge overturned 24% of *phantom* objections and the re-decider 0-4%, so most of
# self_critique's measured edge was the routing rather than the record.
recourse_form = "third_party"

# Stated rather than inherited, because under `third_party` it is no longer debate's
# judge alone: it is the one party that hears every appeal in the experiment. Unset it
# would mean `judge_model`, which is this same weak model — the value is identical and
# the point is that it is now visible.
recourse_judge_model = "openai/gpt-4.1-nano"

# Unchanged from `sweep.toml`. The cap for the roles that emit a decision line -- judge,
# challenger, recourse judge, comprehension probe -- none of which has truncated in four
# runs.
max_tokens = 16384

# Unchanged from `sweep.toml`. The cap for the roles that produce record text: debaters,
# the solo stages, the critic. Nothing here generates record text, but the value is what
# the copied decision was made under and is kept for that reason.
generation_max_tokens = 8192

# Unchanged. The challenger is the role under measurement: at 0 every stakeholder writes
# the same objection, and variance across objections is part of the result.
challenger_temperature = 0.7

# --- provider routing ----------------------------------------------------------------
# Copied from `sweep.toml` unedited. It binds the strong model, which this run does not
# call; the challenger and the recourse judge are gpt-4.1-nano and are unpinned, as they
# were in every run so far. Verify the slugs before any run that does call the strong
# model:
#     uv run python records/derivations/sweep-1-provider-check.py <spec>
[debate.provider_order]
"deepseek/deepseek-v4-flash-0731" = ["gmicloud/fp8", "coreweave/fp8"]
# provider_allow_fallbacks stays at its default False. No fallback is added to make a
# row pass; a pin that silently falls back is not a pin.

[client]
# 16/8, as the sweep proved. The contest stages are two or three short nano calls per
# cell where `decide` was up to seven strong-model ones, so this is if anything
# conservative here.
max_concurrency = 16
max_runs_in_flight = 8

# Each contest directory carries a full copy of the decision it contests — read out of
# the SOURCE tree and written into this one. That is what makes a contest record
# self-contained, and it is why this tree costs disk although it decides nothing.
copy_parent = true

[grading]
# The same Haiku on the ordinary chat-completions endpoint, for the grader and for the
# `agreement` stage that reads line against prose. The `agreement` reading is how the
# phantom rate is measured, so this must not change between the sweep and the
# re-contest: it is the instrument the two runs are compared with.
grader_model = "anthropic/claude-haiku-4.5"
