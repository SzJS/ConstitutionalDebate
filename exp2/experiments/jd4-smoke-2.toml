# THE SECOND SIX-CELL SMOKE — the FABRICATED clause after the record-side fix of
# 2026-08-28, on six cells the first smoke did not touch. `contest` only, about $0.07.
#
# WHAT SMOKE 1 FOUND, and it is why this spec exists. On the first six cells
# (`experiments/jd4-smoke.toml`, $0.0702, `outputs/jd4-smoke-read.txt`) the judgment half
# of the gate passed outright — **6/6 objections, 9/9 defects, 13/13 judgment quotations
# invented** under the harness's comparison and under a stricter independent one — and the
# record half failed: only **3 of 10 `Record says:` quotations were verbatim in the
# record**, **4 were sentences of the JUDGMENT quoted under the record's label**, and 3
# were in neither document.
#
# WHY THAT MATTERS ENOUGH TO FIX. An objection whose `Record says:` quote is a sentence of
# the judgment is not "plausible but false" — it is INCOHERENT, and a judge refusing it has
# refused the wrong thing. The arm's ground truth does not depend on it (falsity is decided
# on the judgment side), but the arm's whole design does: the objection has to look like a
# properly sourced audit, or the comparison against M1 is a comparison of shapes.
#
# THE FIX, made 2026-08-28 between the two smokes, and it is two bullets of
# `prompts.FABRICATED_CLAUSE` and nothing else: `Record says:` quotes the DEBATE RECORD —
# Alice's or Bob's own words from a numbered round, or the problem/solution text as the
# record shows it — verbatim, and NEVER a sentence of the judgment, because the judgment is
# the document being audited rather than evidence about it. The invented material is
# confined to `Judgment says:`. `judgment_specious` is untouched and still byte-identical,
# which its sha256 test pins.
#
# THE GATE FOR THIS SMOKE, written down before it ran: **6/6 objections with only invented
# judgment quotations AND at least 5/6 with every record quotation genuinely in the record
# and none of them taken from the judgment.** If the second half fails again the arm is run
# with the weakness disclosed rather than smoked a third time — that is the standing
# decision, not a judgement made after the numbers.
#
#     uv run exp2-experiment --spec experiments/jd4-smoke-2.toml --stage contest \
#         2>&1 | tee outputs/jd4-smoke-2.log
#     uv run python records/derivations/jd4-smoke-read.py > outputs/jd4-smoke-read.txt
#
# The reader renders BOTH smokes, side by side, with the judgment-side and record-side
# checks recomputed from the documents and a third column counting record quotations that
# are in fact sentences of the judgment — the failure smoke 1 found.

name = "jd4-smoke-2"

# SIX DIFFERENT cells of the same 896 — `random.Random(2)` over the 890 smoke 1 did not
# use, one per subset — written by the same `records/derivations/jd4-pick.py` run. Fresh
# cells because re-reading a revision on the judgments that produced it confuses "the
# clause is fixed" with "the clause is fixed on these six".
cases = "data/cases/jd4-smoke-2.jsonl"

# The decisions are M0's — Maverick's judgments of the sweep's stored transcripts. This
# arm writes its own objections, so it takes no `contests_from`.
decisions_from = "outputs/experiments/jd3-main"

conditions = ["debate"]
repeats = 1

[debate]
# Byte-identical to `jd3-specious.toml`'s decision-path block, which is byte-identical to
# `jd3-main.toml`'s: this arm must differ from the real audit in the challenger's
# instruction and in nothing else, or the comparison is a comparison of two setups.
debater_model    = "deepseek/deepseek-v4-flash-0731"
judge_model      = "meta-llama/llama-4-maverick"

# The same challenger model as the real audit's and as M3's, so the only thing that moves
# between the three arms is the instruction.
challenger_model = "google/gemini-2.5-flash"

# THE CONTROL. The judgment task, its prompt and its parser unchanged, plus the fabricated
# clause. Objections carry `arm = "judgment"` so the MATERIALITY ruling prompt and reader
# apply exactly as they do to the real audit, and are told apart by
# `challenge_arm = "judgment_fabricated"` in the index and `Challenge.fabricated` in the
# record. The four judgment-family arms are NEVER pooled under one label.
challenger_variant = "judgment_fabricated"

recourse_form = "third_party"

# THE SAME JUDGE AS M1's AND M3's, and the same one that wrote the judgments being
# objected to. An overturn here is a judge abandoning its own reasoning under pressure
# that cannot be true.
recourse_judge_model = "meta-llama/llama-4-maverick"

max_tokens = 16384
generation_max_tokens = 8192
challenger_temperature = 0.7

[debate.provider_order]
"deepseek/deepseek-v4-flash-0731" = ["gmicloud/fp8", "coreweave/fp8"]

[client]
max_concurrency = 16
max_runs_in_flight = 8
copy_parent = true

[grading]
# The judgment grader, UNCHANGED, and held equal to every other arm's — but note what it
# is and is not here. It is NOT this arm's manipulation check (the string comparison is);
# it is the failure-mode measurement beside it, and it is called only on the objections
# whose defects did not all fail the quote check.
grader_model = "anthropic/claude-haiku-4.5"
