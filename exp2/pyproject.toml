[project]
name = "exp2"
version = "0.1.0"
description = "TBD"
requires-python = ">=3.12"
# Deliberately minimal: exp1's two-dependency runtime floor, nothing more. Add a
# dependency when this experiment actually needs it, not by inheritance.
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exp2"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
