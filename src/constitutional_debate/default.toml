# Default configuration.
#
# [debate] is the published record of how the decision was set up: every value
# here can change the outcome, and the resolved table is persisted to
# <run_dir>/config.json so a reader can see the conditions it was made under.
#
# [client] is operational: retries, timeouts, concurrency. None of it can change
# the decision, so it is recorded in run.json rather than config.json — two runs
# that produced identical decisions should not look different because a timeout
# was tuned.

[debate]
debater_model = "deepseek/deepseek-v4-flash"
judge_model = "deepseek/deepseek-v4-flash"

n_rounds = 3
turn_style = "simultaneous"   # "simultaneous" | "sequential"

# Prompt-only cap: the prompt states it, transcript.json records the realised
# word_count, and the CLI warns on overrun. Arguments are never truncated.
word_limit = 150

debater_temperature = 0.7
judge_temperature = 0.0

# Ceiling, not a spend — we are billed for realised output tokens. It must leave
# room for native reasoning tokens, which share this budget on reasoning-capable
# models; too low a cap yields truncated or empty content that a retry at the
# same cap cannot fix. judge_cot below roughly triples realised judge output
# tokens; that is comfortable here, but CoT plus a reasoning_effort bump is the
# combination that would start hitting this cap, and truncation is fatal.
max_tokens = 8192

# The protocol's private channel is the "Thinking:" block: private during the
# debate, published afterwards, and recorded either way. Native provider
# reasoning is a second channel that would be private *permanently* — invisible
# to the judge, the opponent and the reader alike — so it is disabled
# deliberately rather than left to a provider default. Anything that can move a
# decision has to end up somewhere a reader can see it.
# Treat as an experiment variable: "off" | "low" | "medium" | "high".
reasoning_effort = "off"

# A documented deviation from the paper's default: Dox/protocols.md records judge
# chain-of-thought as one of Kenton et al.'s null-or-harmful ablations. It is on
# here for a reason that is not accuracy — a public decision that states no
# grounds can be neither read nor contested, and both are the claim under test.
# The verbalised reasoning is the substance of what transcript.md publishes.
# Pass --no-judge-cot for the paper-faithful predict judge; it is a control arm,
# not a configuration a real decision should use.
judge_cot = true
seed = 0

# Recourse: how a finished decision is contested. A challenge is an argument that
# the decision was mistaken; a recourse is a new run that either upholds or
# overturns it. 0 is the judge-only protocol — the recourse judge rules on the
# challenge alone. 1, the default, adds one simultaneous round in which the
# debater whose answer lost argues for the challenge and the winner argues
# against it, and only then does the judge rule. run.json names the protocol
# outright rather than leaving a reader to infer it from this number.
recourse_rounds = 1

# The model that writes a generated challenge. Unset means the debater model: a
# challenger is a debater by another name, and an asymmetry here would confound
# the grounded/specious arms with a difference in capability.
# challenger_model = "deepseek/deepseek-v4-flash"

# Words allowed for a generated challenge. Unset means the profile's word_limit.
# A challenge has to quote the record back, which 150 words does not leave much
# room for.
# challenge_word_limit = 300

# Whether the challenger may report finding nothing to contest. On by default:
# without it there is no way to tell a challenger that missed the error from one
# that found it and argued badly, and the false-alarm rate on sound decisions
# cannot be estimated at all. Set false to reproduce the always-challenge
# behaviour as a control.
challenger_may_decline = true

# Reasoning effort for the challenger alone. Unset means the run's
# reasoning_effort. The challenger's deliberation is an experimental axis: the
# same weak model with thinking on and off isolates inference-time compute from
# capability. Turning it on gives the challenger a reasoning channel beside its
# published Thinking:, which the record then has to publish too.
# challenger_reasoning_effort = "low"

# Sampling penalty against verbatim repetition, applied to every call. 0.0 is
# the protocol as published and changes nothing. It is raised for the
# FindTheFlaws cases because of a measured degenerate decoding loop: a debater
# defending the weaker case repeated one sentence for 126,000 characters, ran
# past a 32,768-token ceiling and killed its run. Raising max_tokens does not
# help — it lets the loop run longer and cost four times as much before failing.
frequency_penalty = 0.0

# How many times a whole decision may be attempted. A retry is a fresh
# independent run, never a re-attempt of a truncated response — that stays fatal,
# since a truncated argument entering the published transcript as though authored
# would be a false statement in the record. Needed because ~25% of FindTheFlaws
# decisions die to a repetition loop, and those failures fall on the debater
# defending the flawed answer, so dropping them would discard the hard error
# cases preferentially. Set 1 to disable.
max_decision_attempts = 2

# Critique/revision pairs in the self_critique arm. 1 is draft -> critique ->
# revision; 2 repeats the pair. Every step is published either way — an
# unpublished critique would make the arm unmatched against debate by
# construction, since a challenger would never see the adversarial work.
n_critique_rounds = 1

# The second debater model. Unset is the same-model variant, where both sides
# get debater_model. With one model the "adversary" shares every blind spot with
# the side it attacks — exactly like self-critique — so debate vs self-critique
# would reduce to role assignment versus self-criticism instruction. Which side
# gets which model is drawn per task, alongside answer assignment and choice
# order, so model identity never becomes a proxy for speaking order.
# debater_model_b = "openai/gpt-5.6-luna"

# The CONSTITUTIONAL profile asks debaters to cite provisions *and quote their
# operative words*, which costs words the other profiles do not have to spend.
# Overriding the limit per profile is how we check whether that binds.
[debate.word_limit_by_profile]
# constitutional = 250

[client]
base_url = "https://openrouter.ai/api/v1"
max_concurrency = 24
# Cells the batch harness keeps open at once (bounds file handles, not requests).
max_runs_in_flight = 12
max_attempts = 5
backoff_base_s = 1.0
backoff_cap_s = 30.0
connect_timeout_s = 10.0
read_timeout_s = 180.0
run_timeout_s = 900.0

[grading]
# Off the decision path: these passes run after every decision is final, over
# completed run directories, and are re-runnable without re-spending anything.
# A separate table because config.json promises that everything in it can change
# the decision, and none of this can.
grader_temperature = 0.0
validator_model = "anthropic/claude-haiku-4.5:batch"
validator_temperature = 0.0
max_tokens = 4096
# Unset means the judge model. The grader compares an objection against a known
# annotation, which is a bounded comparison rather than a judgement call.
# grader_model = "anthropic/claude-haiku-4.5:batch"
